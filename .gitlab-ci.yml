include:
  - project: 'sebsoft/open-source/gitlab'
    ref: main
    file: '/opensource-plugin/opensource-plugin-405+.yml'

variables:
  PLUGIN: 'tool_teachermcp'
  REPOURL: 'https://github.com/sebsoftnl/moodle-tool_teachermcp'
  PATHNAME: 'admin/tool/teachermcp'

# The shared Moodle matrix does not exercise the local stdio/OAuth bridge.
bridge:
  stage: precheck
  image: node:22-alpine
  script:
    - node --check bridge/mcp-bridge.mjs
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
    - TMPDIR="$CI_PROJECT_DIR/.ci-tmp" node --test bridge/*.test.mjs
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.ci-tmp"

# Validate author metadata on every branch, even before a GitHub mirror exists.
Check camp listing:
  rules:
    - when: on_success

# Publish the reviewed branch to GitHub after tests, without merging main or tagging a release.
deploy.github.review:
  stage: deploy
  image: moodlehq/moodle-php-apache:8.1
  # GitLab's default shallow checkout omits ancestors needed by an empty GitHub mirror.
  variables:
    GIT_DEPTH: "0"
  dependencies: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "fix/release-ci-camp-readiness" && $PUSHLOCATION'
    - when: never
  script:
    - |
      set -eu
      git remote add github "$PUSHLOCATION"
      git push --no-tags github "HEAD:refs/heads/${CI_COMMIT_BRANCH}"
