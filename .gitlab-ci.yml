include:
  - project: 'sebsoft/open-source/gitlab'
    ref: main
    file: '/opensource-plugin/opensource-plugin-405+.yml'

variables:
  PLUGIN: 'tool_teachermcp'
  REPOURL: 'https://github.com/sebsoftnl/moodle-tool_teachermcp'
  PATHNAME: 'admin/tool/teachermcp'
  # Opt-in GitHub deployment. Set this to "true" in a tag pipeline or
  # project CI/CD variable, together with PUSHLOCATION, to mirror releases
  # to GitHub. The default keeps tag pipelines from pushing to GitHub.
  GITHUB_PUSH_ENABLED: "true"
