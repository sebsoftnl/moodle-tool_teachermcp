include:
  - project: 'sebsoft/open-source/gitlab'
    ref: main
    file: '/opensource-plugin/opensource-plugin-405+.yml'

variables:
  PLUGIN: 'tool_teachermcp'
  REPOURL: 'https://github.com/sebsoftnl/moodle-tool_teachermcp'
  PATHNAME: 'admin/tool/teachermcp'
  # Publication is an explicit release decision, not a side effect of a tag.
  GITHUB_PUSH_ENABLED: "false"

# The shared Moodle matrix does not exercise the local stdio/OAuth bridge.
bridge:
  stage: precheck
  image: node:22-alpine
  script:
    - node --check bridge/mcp-bridge.mjs
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
    - TMPDIR="$CI_PROJECT_DIR/.ci-tmp" node --test bridge/*.test.mjs
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.ci-tmp"

# Validate author metadata on every branch, even before a GitHub mirror exists.
Check camp listing:
  rules:
    - when: on_success

deploy.github:
  rules:
    - if: '$CI_COMMIT_TAG && $PUSHLOCATION && $GITHUB_PUSH_ENABLED == "true"'
    - when: never
